<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/a9b5133090.js" crossorigin="anonymous"></script>
    <title>Document</title>
</head>
<style>

    *{
        font-family: Arial, Helvetica, sans-serif;
    }
    
    #botonDiv{
        width: 130px;
        height: 50px;
        overflow: hidden;
        background-color: rgb(9, 105, 214);
        border-radius: 10px;
        cursor: pointer;
        position: relative;
        margin-top: 10px;
        &:hover .filtros{
            transform: translateX(0);
        }
        &:hover .conjunto{
            transition: 0.50s;
            transform: translateX(0);
        }
    }

    .filtros{
        width: 100%;
        height: 100%;
        background-color: rgb(96, 161, 235);
        transform: translateX(-100%);
        transition: 0.30s;
        border-radius: 10px;
    }

    .texto{
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        padding: 0px 21px;
        box-sizing: border-box;
        position: absolute;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-weight: bold;
        color: rgb(192, 226, 241);
    }

    .flechas{
        width: 30px;
        height: 30px;
        overflow: hidden;
    }

    .conjunto{
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        font-weight: bold;
        font-size: 20px;
        transform: translateX(-100%);
    }

    .icon{
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        padding: 7px;
    }








    #enlace{
        width: 270px;
        height: 69px;
        border-radius: 12px;
        background-color: #28313a;
        color: white;
        position: relative;
        margin-top: 10px;
        cursor: pointer;
        overflow: hidden;
        &:hover{
            transition: 0.30s;
            color: #28313a;
        }
        &:hover .blanco{
            transform: translateX(0);
        }
        &:hover .icono{
            transition: 0.50s;
            transform: translateX(0);
        }
    }

    #enlace p{
        max-width: 200px;
        font-size: 14px;
        font-weight: bold;
    }

    .blanco{
        width: 100%;
        height: 100%;
        background-color: white;
        transform: translateX(100%);
        transition: 0.50s;
        border-radius: 12px;
    }

    .content{
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        box-sizing: border-box;
        padding: 0px 20px;
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .contentFlechas{
        width: 30px;
        height: 30px;
        display: flex;
        overflow: hidden;
    }

    .icono{
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        padding: 8px;
        transform: translateX(-100%);
        transition: color 0.50s;
    }
    
</style>
<body>
    
    <div id="botonDiv">
        <div class="filtros"></div>
        <div class="texto"><p>Unirse</p>
            <div class="flechas">
                <div class="conjunto">
                    <i class="fa-solid fa-arrow-right icon"></i>
                    <i class="fa-solid fa-arrow-right icon"></i>
                </div>
            </div>
        </div>
    </div>


    <a href="../ficha/index.html"><div id="botonDiv">
        <div class="filtros"></div>
        <div class="texto"><p>Fichas</p>
            <div class="flechas">
                <div class="conjunto">
                    <i class="fa-solid fa-arrow-right icon"></i>
                    <i class="fa-solid fa-arrow-right icon"></i>
                </div>
            </div>
        </div>
    </div></a>


    <a href="../bola/index.html"><div id="botonDiv">
        <div class="filtros"></div>
        <div class="texto"><p>Bola</p>
            <div class="flechas">
                <div class="conjunto">
                    <i class="fa-solid fa-arrow-right icon"></i>
                    <i class="fa-solid fa-arrow-right icon"></i>
                </div>
            </div>
        </div>
    </div></a>



    <div id="enlace">
        <div class="blanco"></div>
        <div class="content"><p>Mas información sobre el alojamiento de videos</p>
            <div class="contentFlechas">
                <i class="fa-solid fa-arrow-right icono"></i>
                <i class="fa-solid fa-arrow-right icono"></i>
            </div>
        </div>
    </div>


</body>
</html>
